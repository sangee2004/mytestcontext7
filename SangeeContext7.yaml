name: Sangee Context7
minObotVersion: v0.25.6
entryKey: sangee-context7
shortDescription: Get up-to-date, version-specific code documentation and examples for any library
upgradeNote: |
  This replaces the Obot-hosted Context7 server with Context7's official hosted MCP server.

  - **Reconnect required:** Select OAuth or anonymous/API-key access. The previous minimum-token setting is no longer used.
  - **Authentication:** OAuth, anonymous access, and optional API-key access are now supported.
  - **Tool changes:** Tool parameters and documentation-retrieval behavior may change with the hosted service.
description: |
  Retrieve current, version-specific library documentation and code examples through [Context7's hosted MCP server](https://context7.com/docs).

  See the [official Context7 documentation](https://context7.com/docs) for setup, authentication, and usage details.

  **Authentication method:** Enter `mcp/oauth` to sign in with OAuth, or `mcp` to connect anonymously and optionally provide a Context7 API key.

  ## Features

  - **Up-to-date Documentation**: Fetch current, version-specific docs and code examples
  - **Automatic Library Resolution**: Find the best Context7 library ID for a package or product
  - **Focused Retrieval**: Query documentation for a specific implementation task or concept
  - **Flexible Authentication**: Sign in with OAuth or connect anonymously with an optional Context7 API key

  ## What you'll need to connect

  Choose OAuth to sign in with Context7 when prompted, or choose Anonymous / API Key to connect without signing in. You can optionally provide a key from https://context7.com/dashboard for higher limits and private sources.

  > **⚠️ Upgrade notice**
  >
  > If you're upgrading this server, note that this replaces the Obot-hosted Context7 server with Context7's official hosted MCP server.
  >
  > - **Reconnect required:** Select OAuth or anonymous/API-key access. The previous minimum-token setting is no longer used.
  > - **Authentication:** OAuth, anonymous access, and optional API-key access are now supported.
  > - **Tool changes:** Tool parameters and documentation-retrieval behavior may change with the hosted service.
metadata:
  categories: Developer Tools, Documentation
icon: https://avatars.githubusercontent.com/u/74989412?v=4
repoURL: https://context7.com/docs
config:
  - name: Authentication method
    key: CONTEXT7_ENDPOINT
    description: Enter `mcp/oauth` for OAuth or `mcp` for anonymous or API-key
      access. See the entry description for details.
    required: true
    sensitive: false
    options:
      - name: OAuth
        value: mcp/oauth
        description: Sign in to Context7 using OAuth
      - name: Anonymous / API Key
        value: mcp
        description: Connect anonymously or authenticate using a Context7 API key
    usage: env
  - name: Context7 API Key
    description: Optional API key for higher limits and private sources; leave blank
      for anonymous access or OAuth
    key: Authorization
    required: false
    sensitive: true
    prefix: "Bearer "
    usage: header
  - name: X-Test
    description: Static header
    key: X-Test
    required: true
    sensitive: false
    value: "hello"
    usage: header
runtime: remote
remoteConfig:
  urlTemplate: https://mcp.context7.com/${CONTEXT7_ENDPOINT}
